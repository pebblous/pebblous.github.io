<svg viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, sans-serif" style="background:var(--card-bg,#ffffff)">
  <rect x="0" y="0" width="660" height="400" rx="16" fill="var(--card-bg, #ffffff)"/>

  <text x="330" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="var(--text-secondary, #4B5563)">EU 투자자 실사 체크리스트 — 6항목 중 3항목이 데이터</text>

  <!-- Row 1 -->
  <g>
    <rect x="30" y="80" width="180" height="90" rx="10" fill="none" stroke="var(--text-muted, #94a3b8)" stroke-width="1.5"/>
    <text x="120" y="118" text-anchor="middle" font-size="14" fill="var(--text-secondary, #4B5563)">리스크</text>
    <text x="120" y="138" text-anchor="middle" font-size="14" fill="var(--text-secondary, #4B5563)">분류</text>
  </g>

  <g>
    <rect x="240" y="80" width="180" height="90" rx="10" fill="#F86825" fill-opacity="0.08" stroke="#F86825" stroke-width="2"/>
    <text x="330" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#F86825">학습 데이터</text>
    <text x="330" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#F86825">출처</text>
  </g>

  <g>
    <rect x="450" y="80" width="180" height="90" rx="10" fill="#F86825" fill-opacity="0.08" stroke="#F86825" stroke-width="2"/>
    <text x="540" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#F86825">기술 문서</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="30" y="190" width="180" height="90" rx="10" fill="none" stroke="var(--text-muted, #94a3b8)" stroke-width="1.5"/>
    <text x="120" y="228" text-anchor="middle" font-size="14" fill="var(--text-secondary, #4B5563)">인간 개입</text>
    <text x="120" y="248" text-anchor="middle" font-size="14" fill="var(--text-secondary, #4B5563)">장치</text>
  </g>

  <g>
    <rect x="240" y="190" width="180" height="90" rx="10" fill="#F86825" fill-opacity="0.08" stroke="#F86825" stroke-width="2"/>
    <text x="330" y="228" text-anchor="middle" font-size="14" font-weight="600" fill="#F86825">거버넌스</text>
    <text x="330" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#F86825">프로세스</text>
  </g>

  <g>
    <rect x="450" y="190" width="180" height="90" rx="10" fill="none" stroke="var(--text-muted, #94a3b8)" stroke-width="1.5"/>
    <text x="540" y="228" text-anchor="middle" font-size="14" fill="var(--text-secondary, #4B5563)">컴플라이언스</text>
    <text x="540" y="248" text-anchor="middle" font-size="14" fill="var(--text-secondary, #4B5563)">로드맵</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="30" y="330" width="20" height="20" rx="4" fill="#F86825" fill-opacity="0.08" stroke="#F86825" stroke-width="2"/>
    <text x="58" y="345" font-size="13" fill="var(--text-secondary, #4B5563)">데이터에 직접 걸리는 항목 (3/6)</text>
    <rect x="330" y="330" width="20" height="20" rx="4" fill="none" stroke="var(--text-muted, #94a3b8)" stroke-width="1.5"/>
    <text x="358" y="345" font-size="13" fill="var(--text-secondary, #4B5563)">그 외 항목</text>
  </g>
</svg>
