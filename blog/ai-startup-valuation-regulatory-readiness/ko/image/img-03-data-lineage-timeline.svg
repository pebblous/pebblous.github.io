<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, sans-serif" style="background:var(--card-bg,#ffffff)">
  <rect x="0" y="0" width="660" height="340" rx="16" fill="var(--card-bg, #ffffff)"/>

  <text x="330" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text-secondary, #4B5563)">데이터 확보 시점(T0)에 기록해야 실사에서 살아남는다</text>

  <!-- T0 marker -->
  <circle cx="90" cy="150" r="8" fill="var(--text-muted, #94a3b8)"/>
  <text x="90" y="180" text-anchor="middle" font-size="13" fill="var(--text-secondary, #4B5563)">데이터 확보</text>
  <text x="90" y="198" text-anchor="middle" font-size="13" fill="var(--text-secondary, #4B5563)">시점 (T0)</text>

  <!-- Branch A: recorded -->
  <line x1="110" y1="120" x2="420" y2="70" stroke="#F86825" stroke-width="2"/>
  <rect x="420" y="45" width="200" height="50" rx="10" fill="#F86825" fill-opacity="0.08" stroke="#F86825" stroke-width="2"/>
  <text x="520" y="65" text-anchor="middle" font-size="13" font-weight="600" fill="#F86825">출처·권리 기록 ✓</text>
  <text x="520" y="82" text-anchor="middle" font-size="12" fill="#F86825">실사팀에 즉시 제출</text>

  <!-- Branch B: not recorded -->
  <line x1="110" y1="180" x2="420" y2="230" stroke="var(--text-muted, #94a3b8)" stroke-width="2"/>
  <rect x="420" y="205" width="200" height="50" rx="10" fill="none" stroke="var(--text-muted, #94a3b8)" stroke-width="1.5"/>
  <text x="520" y="225" text-anchor="middle" font-size="13" fill="var(--text-secondary, #4B5563)">기록 없이 그냥 사용 ✗</text>
  <text x="520" y="242" text-anchor="middle" font-size="12" fill="var(--text-secondary, #4B5563)">수년 뒤 복원 불가</text>

  <text x="330" y="300" text-anchor="middle" font-size="12" fill="var(--text-muted, #94a3b8)">모델은 교체할 수 있어도, 기록하지 않은 출처는 소급해서 만들 수 없다</text>
</svg>
