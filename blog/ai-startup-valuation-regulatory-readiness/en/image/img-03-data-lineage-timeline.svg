<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="Outfit, sans-serif" style="background:var(--card-bg,#ffffff)">
  <rect x="0" y="0" width="660" height="340" rx="16" fill="var(--card-bg, #ffffff)"/>

  <text x="330" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text-secondary, #4B5563)">Record provenance at acquisition (T0) — or it can't be rebuilt later</text>

  <!-- T0 marker -->
  <circle cx="90" cy="150" r="8" fill="var(--text-muted, #94a3b8)"/>
  <text x="90" y="180" text-anchor="middle" font-size="13" fill="var(--text-secondary, #4B5563)">Data</text>
  <text x="90" y="198" text-anchor="middle" font-size="13" fill="var(--text-secondary, #4B5563)">acquired (T0)</text>

  <!-- Branch A: recorded -->
  <line x1="110" y1="120" x2="420" y2="70" stroke="#F86825" stroke-width="2"/>
  <rect x="420" y="45" width="200" height="50" rx="10" fill="#F86825" fill-opacity="0.08" stroke="#F86825" stroke-width="2"/>
  <text x="520" y="65" text-anchor="middle" font-size="13" font-weight="600" fill="#F86825">Provenance recorded ✓</text>
  <text x="520" y="82" text-anchor="middle" font-size="12" fill="#F86825">Ready for diligence</text>

  <!-- Branch B: not recorded -->
  <line x1="110" y1="180" x2="420" y2="230" stroke="var(--text-muted, #94a3b8)" stroke-width="2"/>
  <rect x="420" y="205" width="200" height="50" rx="10" fill="none" stroke="var(--text-muted, #94a3b8)" stroke-width="1.5"/>
  <text x="520" y="225" text-anchor="middle" font-size="13" fill="var(--text-secondary, #4B5563)">Used without a record ✗</text>
  <text x="520" y="242" text-anchor="middle" font-size="12" fill="var(--text-secondary, #4B5563)">Unrecoverable years later</text>

  <text x="330" y="300" text-anchor="middle" font-size="12" fill="var(--text-muted, #94a3b8)">Models can be swapped out. An unrecorded data source cannot be reconstructed after the fact.</text>
</svg>
