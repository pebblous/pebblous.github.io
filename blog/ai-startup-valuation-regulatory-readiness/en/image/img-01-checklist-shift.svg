<svg viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg" font-family="Outfit, sans-serif" style="background:var(--card-bg,#ffffff)">
  <rect x="0" y="0" width="660" height="400" rx="16" fill="var(--card-bg, #ffffff)"/>

  <text x="330" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text-secondary, #4B5563)">EU investor diligence checklist — 3 of 6 items hit data directly</text>

  <!-- Row 1 -->
  <g>
    <rect x="30" y="80" width="180" height="90" rx="10" fill="none" stroke="var(--text-muted, #94a3b8)" stroke-width="1.5"/>
    <text x="120" y="118" text-anchor="middle" font-size="14" fill="var(--text-secondary, #4B5563)">Risk</text>
    <text x="120" y="138" text-anchor="middle" font-size="14" fill="var(--text-secondary, #4B5563)">classification</text>
  </g>

  <g>
    <rect x="240" y="80" width="180" height="90" rx="10" fill="#F86825" fill-opacity="0.08" stroke="#F86825" stroke-width="2"/>
    <text x="330" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#F86825">Training data</text>
    <text x="330" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#F86825">provenance</text>
  </g>

  <g>
    <rect x="450" y="80" width="180" height="90" rx="10" fill="#F86825" fill-opacity="0.08" stroke="#F86825" stroke-width="2"/>
    <text x="540" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#F86825">Technical</text>
    <text x="540" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#F86825">documentation</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="30" y="190" width="180" height="90" rx="10" fill="none" stroke="var(--text-muted, #94a3b8)" stroke-width="1.5"/>
    <text x="120" y="228" text-anchor="middle" font-size="14" fill="var(--text-secondary, #4B5563)">Human</text>
    <text x="120" y="248" text-anchor="middle" font-size="14" fill="var(--text-secondary, #4B5563)">oversight</text>
  </g>

  <g>
    <rect x="240" y="190" width="180" height="90" rx="10" fill="#F86825" fill-opacity="0.08" stroke="#F86825" stroke-width="2"/>
    <text x="330" y="228" text-anchor="middle" font-size="14" font-weight="600" fill="#F86825">Governance</text>
    <text x="330" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#F86825">process</text>
  </g>

  <g>
    <rect x="450" y="190" width="180" height="90" rx="10" fill="none" stroke="var(--text-muted, #94a3b8)" stroke-width="1.5"/>
    <text x="540" y="228" text-anchor="middle" font-size="14" fill="var(--text-secondary, #4B5563)">Compliance</text>
    <text x="540" y="248" text-anchor="middle" font-size="14" fill="var(--text-secondary, #4B5563)">roadmap</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="30" y="330" width="20" height="20" rx="4" fill="#F86825" fill-opacity="0.08" stroke="#F86825" stroke-width="2"/>
    <text x="58" y="345" font-size="13" fill="var(--text-secondary, #4B5563)">Directly hits data (3/6)</text>
    <rect x="290" y="330" width="20" height="20" rx="4" fill="none" stroke="var(--text-muted, #94a3b8)" stroke-width="1.5"/>
    <text x="318" y="345" font-size="13" fill="var(--text-secondary, #4B5563)">Other items</text>
  </g>
</svg>
