<svg viewBox="0 0 660 360" xmlns="http://www.w3.org/2000/svg" font-family="Outfit, sans-serif" style="background:var(--card-bg,#ffffff)">
  <rect x="0" y="0" width="660" height="360" rx="16" fill="var(--card-bg, #ffffff)"/>

  <text x="330" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text-secondary, #4B5563)">Reframing compliance: from cost to trust infrastructure</text>

  <!-- Left panel: old view -->
  <g>
    <text x="165" y="70" text-anchor="middle" font-size="13" fill="var(--text-muted, #94a3b8)">Old view</text>
    <rect x="65" y="90" width="200" height="60" rx="10" fill="none" stroke="var(--text-muted, #94a3b8)" stroke-width="1.5"/>
    <text x="165" y="126" text-anchor="middle" font-size="15" fill="var(--text-secondary, #4B5563)">Compliance</text>
    <line x1="165" y1="150" x2="165" y2="200" stroke="var(--text-muted, #94a3b8)" stroke-width="2"/>
    <path d="M155 190 L165 205 L175 190" fill="none" stroke="var(--text-muted, #94a3b8)" stroke-width="2"/>
    <rect x="65" y="215" width="200" height="55" rx="10" fill="none" stroke="var(--text-muted, #94a3b8)" stroke-width="1.5"/>
    <text x="165" y="248" text-anchor="middle" font-size="14" fill="var(--text-secondary, #4B5563)">Cost (line item)</text>
  </g>

  <!-- Right panel: new view -->
  <g>
    <text x="495" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#F86825">Pebblous angle</text>
    <rect x="395" y="90" width="200" height="60" rx="10" fill="#F86825" fill-opacity="0.08" stroke="#F86825" stroke-width="2"/>
    <text x="495" y="126" text-anchor="middle" font-size="15" font-weight="600" fill="#F86825">Compliance</text>
    <line x1="495" y1="150" x2="495" y2="200" stroke="#F86825" stroke-width="2"/>
    <path d="M485 205 L495 190 L505 205" fill="none" stroke="#F86825" stroke-width="2"/>
    <rect x="395" y="215" width="200" height="55" rx="10" fill="#F86825" fill-opacity="0.08" stroke="#F86825" stroke-width="2"/>
    <text x="495" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#F86825">Trust infrastructure (asset)</text>
    <text x="495" y="257" text-anchor="middle" font-size="12" font-weight="600" fill="#F86825">→ Fundability ↑</text>
  </g>
</svg>
