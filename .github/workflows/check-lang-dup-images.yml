# 국·영문 같은 그림 두 벌 막기 (C6 6단계, 2026-11-09)
# 영문 글이 한국어판과 똑같은 그림 파일을 따로 가지면 사이트 용량이 두 배로 든다
# (11-09 실측 1,264개·0.357GB, Pages 배포 1GB 허용치 초과·시간 초과의 조건).
# PR 과 main 에서 en/ 파일이 같은 자리 ko/ 파일과 내용까지 같으면 실패로 표시한다.
# 판단 규칙·예외는 .github/scripts/check-lang-dup-images.py 머리 주석.

name: Check Lang Duplicate Images

on:
  pull_request:
    paths:
      - '**/en/**'
      - '**/ko/**'
      - '.github/scripts/check-lang-dup-images.py'
      - '.github/workflows/check-lang-dup-images.yml'
  push:
    branches: [main]
    paths:
      - '**/en/**'
      - '**/ko/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (그림 내용은 받지 않음)
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            articles.d

      - name: 같은 그림 두 벌 검사
        run: python3 .github/scripts/check-lang-dup-images.py HEAD
