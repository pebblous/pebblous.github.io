# 캐시버스트(?v=) 스테일 검사 — 공용 CSS/JS 변경 시 index.html 참조 갱신 강제.
#
# 스크립트(tools/check-cache-bust.py)는 자산 3 — 진본(blog-service)에서 관리,
# sync-to-sabon으로 미러된다. 이 워크플로우 파일은 sync 대상이 아니라 사본 직접 관리.
# 배경: css/styles.css 변경(2026-05-26) 후에도 ?v=20250109-2로 방치된 사례 (PR #980).

name: Check Cache-Bust Versions

on:
  pull_request:
    paths:
      - 'css/**'
      - 'styles/**'
      - 'scripts/**'
      - 'index.html'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Check cache-bust versions
        run: |
          if [ ! -f tools/check-cache-bust.py ]; then
            echo "⚠️ tools/check-cache-bust.py 없음 — 진본 sync 대기 중, 검사 건너뜀"
            exit 0
          fi
          python3 tools/check-cache-bust.py --base "origin/${{ github.base_ref }}" --head HEAD
