name: PR Conflict Auto-Heal (articles.json)

# articles.json 은 모든 글 PR이 같은 파일에 append 하는 단일 레지스트리라 동시 PR이면 충돌한다.
# 우리 articles-union 드라이버는 *로컬* git merge 에서만 돌고, GitHub 서버 머지는 .gitattributes
# 머지 드라이버(커스텀/내장 union 모두)를 실행하지 않으므로 GitHub은 항상 CONFLICTING으로 표시한다.
# 이 워크플로가 그 수동 해소를 자동화한다: main이 갱신될 때마다(=충돌이 새로 생기는 시점) 열린 PR 중
# CONFLICTING 인 것들에 origin/main 을 union 드라이버로 머지해 PR 브랜치를 갱신한다.
# (근본 해결 Phase 1 = articles.json 을 생성형 인덱스로 전환 — 별도 마일스톤. 이건 그 전까지의 무인 치유.)

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'   # backstop: main push 없이 열린 충돌 PR도 30분마다 치유
  workflow_dispatch:

concurrency:
  group: pr-conflict-autoheal
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # org 정책이 GITHUB_TOKEN 의 PR 재트리거/푸시를 막으므로 PAT(INDEX_PUSH_TOKEN) 우선(#289).
          token: ${{ secrets.INDEX_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Register custom merge drivers (articles-union)
        run: bash tools/setup-merge-drivers.sh

      - name: Heal CONFLICTING open PRs
        env:
          GH_TOKEN: ${{ secrets.INDEX_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin main --quiet

          # GitHub은 mergeability를 lazy하게 계산해, 막 만들어진 PR은 한동안 UNKNOWN으로 남는다.
          # gh pr list 의 mergeable 필터는 UNKNOWN을 CONFLICTING으로 못 잡아 적체 PR을 놓친다(사각지대).
          # → 각 열린 PR을 gh pr view로 한 번 찔러 계산을 강제(트리거)한 뒤, 잠깐 기다렸다가 다시 조회한다.
          mapfile -t allnums < <(gh pr list --base main --state open --json number --jq '.[].number')
          for n in "${allnums[@]}"; do gh pr view "$n" --json mergeable >/dev/null 2>&1 || true; done
          sleep 15

          # 열린 PR 중 base=main 이고 GitHub이 CONFLICTING 으로 판정한 것만 대상
          mapfile -t rows < <(gh pr list --base main --state open \
            --json number,headRefName,mergeable \
            --jq '.[] | select(.mergeable=="CONFLICTING") | [.number, .headRefName] | @tsv')

          if [ "${#rows[@]}" -eq 0 ]; then
            echo "치유 대상 CONFLICTING PR 없음."
            exit 0
          fi

          healed=0; skipped=0
          for row in "${rows[@]}"; do
            num="${row%%$'\t'*}"
            branch="${row#*$'\t'}"
            echo "::group::PR #$num ($branch)"

            if ! git fetch origin "$branch" --quiet; then
              echo "::warning::PR #$num 브랜치 fetch 실패 — 건너뜀"; skipped=$((skipped+1)); echo "::endgroup::"; continue
            fi

            git checkout -B _heal "origin/$branch" --quiet

            if git merge origin/main -m "auto-heal: merge main into PR #$num (articles-union driver)" --quiet; then
              # 머지 성공(드라이버가 articles.json/changelog 충돌 해소). 변화 없으면 푸시 생략.
              if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$branch")" ]; then
                echo "변경 없음 — 푸시 생략"
              elif jq empty articles.json >/dev/null 2>&1 \
                   && ! grep -q '<<<<<<<' articles.json \
                   && ! { [ -f history/changelog.jsonl ] && grep -q '<<<<<<<' history/changelog.jsonl; }; then
                if git push origin "HEAD:$branch"; then
                  echo "✅ PR #$num 자동 치유 완료"; healed=$((healed+1))
                else
                  echo "::warning::PR #$num 푸시 실패(권한/PAT 확인)"; skipped=$((skipped+1))
                fi
              else
                echo "::warning::PR #$num 머지 결과 articles.json 무효 — 건너뜀"; skipped=$((skipped+1))
              fi
            else
              # 드라이버로 못 푸는 실제 콘텐츠 충돌 → 사람에게 남김
              unmerged="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              git merge --abort 2>/dev/null || true
              echo "::warning::PR #$num — articles.json 외 충돌($unmerged) → 사람 검토 필요"
              gh pr comment "$num" --body "🤖 자동치유 보류 — articles.json 외 충돌 파일이 있어 수동 머지가 필요합니다: \`${unmerged:-?}\`" 2>/dev/null || true
              skipped=$((skipped+1))
            fi

            git checkout main --quiet 2>/dev/null || git checkout --detach origin/main --quiet
            git branch -D _heal --quiet 2>/dev/null || true
            echo "::endgroup::"
          done

          echo "요약: 치유 $healed · 보류/건너뜀 $skipped"

      # 치유가 정상으로 돌아오면 열려 있던 경보를 닫는다 — 사람이 손으로 닫을 일을 만들지 않는다.
      - name: 회복 시 경보 닫기
        if: success()
        env:
          GH_TOKEN: ${{ secrets.INDEX_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          num=$(gh issue list --label autoheal-down --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "${num:-}" ]; then
            gh issue comment "$num" --body "✅ 자동치유가 정상으로 돌아왔습니다 (실행 [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))." || true
            gh issue close "$num" || true
            echo "경보 이슈 #$num 닫음"
          fi

  # 봇이 조용히 죽는 것을 막는 장치. 단발 실패는 넘기고 연속 2회부터 알린다 —
  # 2026-08-06 에 세 번 연속 실패했는데 우연히 발견하기 전까지 아무도 몰랐다.
  alert:
    needs: heal
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: 연속 실패면 이슈로 알린다
        env:
          GH_TOKEN: ${{ secrets.INDEX_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # 직전 실행도 실패였는지 확인(이번 실행 제외). 단발 깜빡임으로 이슈를 만들지 않는다.
          prev=$(gh run list --workflow pr-conflict-autoheal.yml --limit 5 \
                   --json databaseId,conclusion \
                   --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | .[0].conclusion // empty")
          echo "직전 실행 결과: ${prev:-없음}"
          if [ "${prev:-}" != "failure" ] && [ "${prev:-}" != "cancelled" ]; then
            echo "단발 실패 — 알리지 않음"; exit 0
          fi

          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --label autoheal-down --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "${num:-}" ]; then
            gh issue comment "$num" --body "❌ 또 실패했습니다 — [실행 기록]($url)" || true
            echo "기존 경보 이슈 #$num 에 덧붙임"
          else
            gh label create autoheal-down --color B60205 --description "충돌 자동치유 봇 실패" 2>/dev/null || true
            gh issue create --label autoheal-down \
              --title "충돌 자동치유 봇이 연속 실패하고 있습니다" \
              --body "$(printf '%s\n' \
                "PR 충돌 자동치유 워크플로가 **연속 2회 이상** 실패했습니다." \
                "" \
                "이 봇이 멈추면 글 PR이 \\`articles.json\\` 에서 어긋난 채 쌓입니다. 겉으로는 조용하고, 머지하려 할 때에야 드러납니다." \
                "" \
                "- 실패한 실행: $url" \
                "- 손으로 푸는 법: PR 브랜치에서 \\`git merge origin/main\\` (union 드라이버 등록 필요 — \\`bash tools/setup-merge-drivers.sh\\`) 후 push" \
                "" \
                "치유가 정상으로 돌아오면 이 이슈는 자동으로 닫힙니다.")" || true
            echo "새 경보 이슈 생성"
          fi
