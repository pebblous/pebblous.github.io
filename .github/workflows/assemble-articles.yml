name: Assemble articles.json (sharding)

# 샤딩 모델: 글마다 사이드카 articles.d/<id>.json. articles.json 은 CI 생성 산출물.
# 사이드카가 추가/수정되면(=articles.d/** push) assemble-articles.py 가 base(기존 articles.json) ∪
# 사이드카로 재조립해 articles.json 을 갱신한다(PR+자체머지). 결과 articles.json 변경은
# update-sitemap.yml(articles.json 트리거)이 이어받아 sitemap/rss/llms 를 갱신한다.
# no-op 가드: 사이드카가 0개면 assemble 이 articles.json 을 건드리지 않는다 → 마이그레이션 전 안전.

on:
  push:
    branches: [main]
    paths:
      - 'articles.d/**'
      - 'articles.categories.json'
      - 'tools/assemble-articles.py'
      - 'tools/compute-related.py'
  workflow_dispatch:

# update-sitemap 와 같은 직렬화 그룹 — 인덱스 push 경합 방지(#289).
concurrency:
  group: update-indexes
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # org 정책이 GITHUB_TOKEN 의 PR 생성을 막으므로 PAT 우선(#289).
          token: ${{ secrets.INDEX_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Assemble articles.json (base ∪ sidecars)
        run: |
          python3 tools/assemble-articles.py
          echo "assemble 완료"

      - name: Compute related[] (orphan rescue)
        # 태그 유사도 상위 N + reverse-guarantee 로 각 글에 related:[path,...] 를 굽는다.
        # 런타임 common-utils.js 는 이 필드를 O(1) 로 읽어 Related Posts 를 렌더한다
        # (없으면 태그 계산 fallback). orphan(인바운드 0) 최소화 목적. tools/compute-related.py.
        run: |
          python3 tools/compute-related.py
          echo "compute-related 완료"

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --exit-code --quiet articles.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ articles.json 변경 없음 (사이드카 없음/이미 최신)"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 articles.json 변경:" && git diff --stat articles.json
          fi

      - name: Commit & merge via PR
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.INDEX_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # main 직접 push 는 ruleset 이 거부(#289) → 봇 PR 자체머지.
          BRANCH="auto/assemble-articles-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -b "$BRANCH"
          git add articles.json
          git commit -m "chore(index): assemble articles.json from sidecars [skip ci]"
          git push origin "$BRANCH"

          cleanup() { git push origin --delete "$BRANCH" >/dev/null 2>&1 || true; }
          if ! PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(index): assemble articles.json [skip ci]" \
            --body "articles.d/ 사이드카 → articles.json 재조립(assemble-articles.yml). base ∪ 사이드카."); then
            cleanup
            echo "::error::assemble PR 생성 실패 — INDEX_PUSH_TOKEN 확인(#289)."
            exit 1
          fi

          # 머지(승인0·코드오너無 → 즉시 가능). 성패는 API 응답이 아니라 PR 의 실제 상태(MERGED)로 판정한다.
          # 2026-09-30 재발(#289): 502 뒤 "Merge already in progress" 를 실패로 보고 PR 을 닫아, 서버가
          # 진행 중이던 머지를 버렸다. 일시 장애는 재시도하고, 머지 진행 중이면 PR 을 닫지 않는다.
          echo "$PR_URL"
          PR_NUM="${PR_URL##*/}"
          pr_state() { gh pr view "$PR_NUM" --json state --jq .state 2>/dev/null || echo UNKNOWN; }
          merged=false; out=""
          for i in 1 2 3 4 5 6; do
            if out=$(gh pr merge "$PR_NUM" --merge --delete-branch 2>&1); then echo "$out"; merged=true; break; fi
            echo "머지 시도 $i/6 실패: $out"
            sleep 15
            if [ "$(pr_state)" = "MERGED" ]; then echo "PR 상태 MERGED 확인 — 응답은 실패였지만 머지는 됐다."; merged=true; break; fi
          done
          if [ "$merged" = "true" ]; then
            cleanup  # 상태로 성공 판정한 경우 브랜치가 남을 수 있어 멱등 삭제
          else
            state=$(pr_state)
            if [ "$state" = "OPEN" ] && [[ "$out" != *"in progress"* ]]; then
              gh pr close "$PR_NUM" --delete-branch >/dev/null 2>&1 || cleanup
            else
              echo "PR #$PR_NUM 을 닫지 않고 남긴다(상태 $state, 머지 진행 중일 수 있음) — 사람이 잇는다."
            fi
            echo "::error::assemble PR #$PR_NUM 머지 실패(최종 상태 $state). GitHub API 일시 장애면 workflow_dispatch 로 재실행, 반복되면 INDEX_PUSH_TOKEN 권한/ruleset 확인(#289)."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Assemble articles.json" >> $GITHUB_STEP_SUMMARY
          echo "- **Changed**: ${{ steps.check_changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
